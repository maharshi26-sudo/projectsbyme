<!DOCTYPE html>
<html>
<head>
    <title>Thank You</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #f0f9ff, #cbebff);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* better for mobile */
            padding: 20px; /* prevents content touching edges */
            animation: fadeIn 1s ease-in-out;
        }

        .thankyou-box {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            text-align: center;
            width: 100%; /* flexible */
            max-width: 500px; /* limit on large screens */
            animation: popUp 0.8s ease-in-out;
        }

        h1 {
            color: rgb(64, 172, 136);
            margin-bottom: 15px;
            font-size: 2em;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #555;
        }

        .emoji {
            font-size: 45px;
            margin-bottom: 15px;
            animation: bounce 1.5s infinite;
        }

        a {
            display: inline-block;
            background: #40abc1;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #2e7d8a;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        @keyframes popUp {
            from {transform: scale(0.8); opacity: 0;}
            to {transform: scale(1); opacity: 1;}
        }

        @keyframes bounce {
            0%, 100% {transform: translateY(0);}
            50% {transform: translateY(-10px);}
        }

        /* 📱 Responsive adjustments */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.6em;
            }

            p {
                font-size: 14px;
            }

            .emoji {
                font-size: 40px;
            }

            a {
                display: block; /* button full width */
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="thankyou-box">
        <div class="emoji">🎉</div>
        <h1>Thank You!</h1>
        <p>Your details have been submitted successfully.</p>
        <a href="submitdone.html">Go Back to Home</a>
    </div>
</body>
</html>
